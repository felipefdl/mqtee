# Advanced CodeQL: actions + rust (no build) on Ubuntu; Swift manual build on macOS.
# Default setup is disabled for this repo so this workflow owns scanning.
#
# Swift needs a real xcodebuild because the project uses PBXFileSystemSynchronizedRootGroup
# (empty traditional Sources phases), which CodeQL autobuild cannot see.
#
# Toolchain + Rust XCFramework run BEFORE CodeQL init so brew/cargo are not under the
# Swift tracer. Only xcodebuild runs after init (traced extraction).
#
# Action majors (checked 2026-07-24):
#   actions/checkout@v7
#   github/codeql-action@v4
#   dtolnay/rust-toolchain@stable
#   Swatinem/rust-cache@v2

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:17 UTC (offset to avoid top-of-hour congestion)
    - cron: "17 6 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            os: ubuntu-latest
          - language: rust
            build-mode: none
            os: ubuntu-latest
          - language: swift
            build-mode: manual
            # Apple Silicon only. macos-latest can land on Intel; MACOS_ONLY builds aarch64.
            os: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # --- Swift prep (before CodeQL init; not traced) ---

      - name: Install Rust toolchain
        if: matrix.language == 'swift'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        if: matrix.language == 'swift'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: codeql-swift

      - name: Build Rust XCFramework (macOS only)
        if: matrix.language == 'swift'
        env:
          MACOS_ONLY: "1"
        run: ./rust/build-xcframework.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Only the Swift app build is traced for extraction.
      - name: Build Swift app (macOS)
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project mqtee.xcodeproj \
            -scheme mqtee \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
